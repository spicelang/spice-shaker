# Spice CI
name: Spice CI

on:
  push:
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  build:
    name: C++ CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Spice
        uses: spicelang/spice-setup-action@v1

      - name: Run tests
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh