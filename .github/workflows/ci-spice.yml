# Spice CI
name: Spice CI

on:
  push:
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  build:
    name: C++ CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Spice
        uses: spicelang/spice-setup-action@v1

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Run tests
        run: spice run ./test/spice-shaker-test.spice