name: Release

on:
  push:
    tags:
      - '*'

# Only the release job writes, the build jobs run third-party code (the Spice compiler and Spice Shaker, the packages) read-only
permissions:
  contents: read

env:
  # The Spice compiler that builds the release. 0.29.4 is the first release whose std can run programs with captured output
  # on Windows, which Spice Shaker needs to unpack packages.
  SPICE_VERSION: '0.29.4'
  # The Linux executables link glibc dynamically and are built in this container, so they need its glibc (2.35) or a newer
  # one. The compiler is a static executable and runs in it as well.
  LINUX_BUILD_IMAGE: 'ubuntu:22.04'
  # The newest glibc symbol version a Linux executable may require, the glibc of LINUX_BUILD_IMAGE
  LINUX_MAX_GLIBC: '2.35'

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The released executable reports SHAKER_VERSION, and the package is published with the version of spice.toml. Both have
      # to match the tag, which may have a 'v' prefix.
      - name: Compare tag with spice.toml and SHAKER_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/spice.toml | head -n 1)"
          driver="$(sed -n 's/.*SHAKER_VERSION = "v\{0,1\}\([^"]*\)".*/\1/p' src/driver.spice)"
          echo "Tag: $tag, spice.toml: $manifest, SHAKER_VERSION: $driver"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$driver" ]; then
            echo "::error::The tag $TAG does not match the version in src/spice.toml ($manifest) and SHAKER_VERSION in src/driver.spice ($driver)"
            exit 1
          fi

  build:
    name: Build - ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # The platforms are independent of each other, like separate jobs
      fail-fast: false
      matrix:
        include:
          - name: Linux/x86_64
            runs-on: ubuntu-26.04
            os: linux
            arch: amd64
          - name: Linux/AArch64
            runs-on: ubuntu-26.04-arm
            os: linux
            arch: arm64
          - name: MacOS/AArch64
            runs-on: macos-26
            os: darwin
            arch: arm64
          - name: Windows/x86_64
            runs-on: windows-2025
            os: windows
            arch: amd64
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE_NAME: spice-shaker_${{ matrix.os }}_${{ matrix.arch }}
      EXE: spice-shaker${{ matrix.os == 'windows' && '.exe' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Toolchain per platform. On Linux for the unit tests on the runner, the release itself is built in LINUX_BUILD_IMAGE
      - name: Install toolchain (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libssl-dev pkg-config

      # Spice Shaker links Homebrew's OpenSSL. The libzstd the released compiler loads comes with spice-setup-action
      - name: Install toolchain (macOS)
        if: matrix.os == 'darwin'
        run: |
          brew update
          brew install openssl@3 pkgconf

      # The MinGW toolchain and OpenSSL of MSYS2. Its bin dir goes first on the PATH, so the compiler finds its clang (that
      # searches the MSYS2 libraries) before the one of the runner
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
          path-type: inherit

      - name: Put MinGW on PATH (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH

      - name: Setup Spice
        uses: spicelang/spice-setup-action@v1
        with:
          spice-version: ${{ env.SPICE_VERSION }}

      # Spice Shaker cannot install its own dependencies before it is built, so a released Spice Shaker installs them from the
      # lock file
      - name: Setup Spice Shaker
        uses: ./.github/actions/setup-spice-shaker

      - name: Install dependencies
        working-directory: src
        run: spice-shaker sync

      - name: Run unit tests
        run: spice test src/tests.spice

      # glibc linked dynamically, OpenSSL statically, in a container with an older glibc than the runner's (see the script).
      # std/net/tls finds the CA certificates of distributions that keep them elsewhere than Ubuntu.
      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: |
          spice_dir="$(dirname "$(command -v spice)")"
          docker run --rm \
            -v "$spice_dir:$spice_dir:ro" -v "$SPICE_STD_DIR:$SPICE_STD_DIR:ro" -v "$PWD:/work" -w /work \
            -e "PATH=$spice_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" -e SPICE_STD_DIR \
            -e "OWNER=$(id -u):$(id -g)" \
            "$LINUX_BUILD_IMAGE" bash .github/scripts/build-linux-release.sh
          ./build/"$EXE" --version

      - name: Build
        if: matrix.os != 'linux'
        run: |
          mkdir -p build && cd build
          flags=(-O3 -lto)
          case "${{ matrix.os }}" in
            # Linked dynamically against Homebrew's OpenSSL (macOS has no static executables), which is keg-only and thus
            # not on the default pkg-config path
            darwin) export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" ;;
            # Linked dynamically against the OpenSSL of MSYS2, whose DLLs are shipped next to the executable
            windows) ;;
          esac
          spice build "${flags[@]}" --output "$EXE" ../src/main.spice
          chmod +x "$EXE"
          ./"$EXE" --version

      - name: Inspect executable (Linux)
        if: matrix.os == 'linux'
        working-directory: build
        run: |
          file ./spice-shaker
          readelf -d ./spice-shaker | grep NEEDED
          # Only libraries of every glibc system are loaded, OpenSSL is linked in
          if readelf -d ./spice-shaker | grep NEEDED | grep -vE '\[(libc\.so\.6|libgcc_s\.so\.1|ld-linux[^]]*\.so\.[0-9]+)\]'; then
            echo "::error::The executable needs other shared libraries than glibc and libgcc"
            exit 1
          fi
          # No glibc symbol newer than the glibc of the build container
          newest="$(objdump -T ./spice-shaker | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Newest required glibc symbol version: $newest"
          if [ "$(printf '%s\n%s\n' "$newest" "$LINUX_MAX_GLIBC" | sort -V | tail -n 1)" != "$LINUX_MAX_GLIBC" ]; then
            echo "::error::The executable needs glibc $newest, newer than $LINUX_MAX_GLIBC"
            exit 1
          fi

      - name: Inspect executable (macOS)
        if: matrix.os == 'darwin'
        working-directory: build
        run: otool -L ./spice-shaker

      # The DLLs from MSYS2 that the executable needs (OpenSSL, and the MinGW runtime if it is linked dynamically)
      - name: Collect DLLs (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        working-directory: build
        run: |
          ldd ./spice-shaker.exe
          ldd ./spice-shaker.exe | awk '$3 ~ /^\/mingw64\// { print $3 }' | sort -u | xargs -r -I{} cp -v {} .

      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE_NAME"
          cp "build/$EXE" LICENSE README.md "dist/$ARCHIVE_NAME/"
          if [ "${{ matrix.os }}" = windows ]; then
            cp build/*.dll "dist/$ARCHIVE_NAME/" 2>/dev/null || true
            # Smoke test of the packaged executable, with only the shipped DLLs from outside the system dirs
            (cd "dist/$ARCHIVE_NAME" && PATH="/c/Windows/system32:/c/Windows" ./"$EXE" --version)
            (cd "dist/$ARCHIVE_NAME" && 7z a -tzip "../$ARCHIVE_NAME.zip" .)
          else
            tar -czf "dist/$ARCHIVE_NAME.tar.gz" -C "dist/$ARCHIVE_NAME" .
          fi
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum spice-shaker_* > spice-shaker_checksums.txt
          cat spice-shaker_checksums.txt

      # Like the Spice compiler releases: named 'v<version>', with the changelog generated by GitHub, a pre-release for
      # pre-release tags (e.g. 0.3.0-rc1)
      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "v${TAG#v}" --generate-notes)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}" spice-shaker_*
